spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC
    username: root
    password: your-mysql-password
  ai:
    openai:
      chat:
        options:
          tool-calling:
            enabled: true
          completions-path: /v1/chat/completions
          model: deepseek-ai/DeepSeek-V3
        api-key: your-siliconflow-api-key
        base-url: https://api.siliconflow.cn

# 服务器配置
server:
  port: 1236

# 文件上传配置：本地存储根目录（请按你的实际路径修改）
file:
  upload-dir: D:/AA简历项目/心理健康助手/code/ai-springboot/files

# JWT配置
jwt:
  secret: your-jwt-secret
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀

# 调试日志：打印Spring AI构建请求与JDK HttpClient实际发送内容
logging:
  level:
    org.springframework.ai: DEBUG
    jdk.httpclient: TRACE
    jdk.httpclient.HttpClient: TRACE
